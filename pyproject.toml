[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "drf-envelope"
version = "0.1.0"
description = "Uniform error envelopes for DRF: every failure becomes {error: {code, message, details}} with stable, documented codes."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Hossam Rakha" }]
keywords = ["django", "drf", "api", "errors", "envelope", "rest-framework"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Framework :: Django",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Internet :: WWW/HTTP",
]
dependencies = ["django>=4.2"]

[project.urls]
Repository = "https://github.com/hossam1244/drf-envelope"

[dependency-groups]
dev = ["djangorestframework>=3.15", "pytest>=8", "pytest-django>=4.8", "ruff>=0.6", "coverage>=7.6", "pytest-mock>=3.14"]

[tool.hatch.build.targets.wheel]
packages = ["src/drf_envelope"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP"]
ignore = ["B008"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tests.settings"
python_files = ["test_*.py"]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["src/drf_request_id"]
command_line = "-m pytest"

[tool.coverage.report]
show_missing = true
